    <!--
      Google tag (gtag.js) with Consent Mode v2.

      The tag itself is NOT loaded here. Nothing in this document reaches
      googletagmanager.com: the script is added by src/lib/analyticsTag.ts
      once the visitor has accepted, and never before.

      It used to be an `async` script tag beside this block, with a
      preconnect above it. Consent Mode kept the cookies unwritten, but the
      request still went out before anyone had answered the banner, carrying
      the visitor's address, user agent and referring page to Google. The
      privacy policy this site serves says no measurement data is collected
      until acceptance, and that could not both be true.

      What stays here is the part that has to run first: the default denial
      and any stored opt-in, queued into dataLayer so the tag reads them the
      moment it does load.
    -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}

      // Deny every storage type up front. This must run before gtag.js
      // loads, otherwise the tag writes cookies before consent is known.
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
        functionality_storage: 'denied',
        personalization_storage: 'denied',
        security_storage: 'granted',
        wait_for_update: 500
      });

      // Re-apply an earlier opt-in before the first pageview is sent.
      try {
        if (localStorage.getItem('cookie-consent') === 'granted') {
          gtag('consent', 'update', { analytics_storage: 'granted' });
        }
      } catch (e) {
        // Site data blocked by the browser: stay denied.
      }

      gtag('js', new Date());
      gtag('config', 'G-ZJPCFFZWSB');
    </script>
